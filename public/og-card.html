<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Fraunces:opsz,wght@9..144,700;9..144,800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #efe3c9;
      }
      .frame {
        width: 1200px;
        height: 630px;
        padding: 28px;
        background:
          radial-gradient(
            900px 420px at 8% -20%,
            rgba(224, 160, 58, 0.28),
            transparent 55%
          ),
          radial-gradient(
            700px 380px at 108% 10%,
            rgba(79, 122, 102, 0.18),
            transparent 50%
          ),
          linear-gradient(180deg, #f7efe0 0%, #efe3c9 100%);
      }
      .card {
        position: relative;
        width: 100%;
        height: 100%;
        border: 6px solid #c45c3e;
        border-radius: 36px;
        overflow: hidden;
        background: #f7efe0;
      }
      .copy {
        position: absolute;
        left: 56px;
        top: 58px;
        width: 560px;
        z-index: 2;
      }
      .brand {
        font-family: 'Baloo 2', sans-serif;
        font-weight: 800;
        font-size: 18px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #9a3d28;
      }
      .kicker {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 14px;
        font-family: 'Baloo 2', sans-serif;
        font-weight: 800;
        font-size: 22px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #8a5a10;
      }
      .dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #e0a03a;
        border: 2px solid #2a2118;
      }
      h1 {
        margin-top: 22px;
        font-family: Fraunces, serif;
        font-weight: 800;
        font-size: 92px;
        line-height: 0.88;
        color: #2a2118;
      }
      h1 em {
        font-style: italic;
        color: #c45c3e;
      }
      .sub {
        margin-top: 28px;
        font-family: Fraunces, serif;
        font-weight: 700;
        font-size: 28px;
        line-height: 1.25;
        color: #5a4c3d;
        max-width: 520px;
      }
      .pill {
        display: inline-block;
        margin-top: 32px;
        padding: 12px 22px;
        border-radius: 999px;
        background: #2a2118;
        color: #fff8ec;
        font-family: 'Baloo 2', sans-serif;
        font-weight: 800;
        font-size: 20px;
        letter-spacing: 0.08em;
      }
      .boy {
        position: absolute;
        right: -70px;
        bottom: -90px;
        width: 700px;
        z-index: 1;
        -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 18%);
        mask-image: linear-gradient(90deg, transparent 0%, #000 18%);
      }
      .polaroid {
        position: absolute;
        right: 430px;
        top: 58px;
        width: 210px;
        padding: 12px 12px 28px;
        background: #fff8ec;
        border-radius: 18px;
        box-shadow: 0 18px 40px rgba(42, 33, 24, 0.16);
        transform: rotate(-8deg);
        z-index: 3;
      }
      .polaroid img {
        width: 100%;
        display: block;
        border-radius: 10px;
      }
      .sun {
        position: absolute;
        right: 36px;
        top: 28px;
        width: 88px;
        height: 88px;
        border-radius: 50%;
        background: #e0a03a;
        box-shadow:
          0 0 0 10px #f3d28a,
          0 0 0 16px rgba(224, 160, 58, 0.35);
        z-index: 2;
      }
      .sun::before,
      .sun::after {
        content: '';
        position: absolute;
        inset: -22px;
        background:
          radial-gradient(circle at center, transparent 42px, transparent 42px),
          repeating-conic-gradient(
            from 0deg,
            #e0a03a 0 8deg,
            transparent 8deg 30deg
          );
        border-radius: 50%;
        z-index: -1;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="card">
        <div class="sun"></div>
        <div class="copy">
          <p class="brand">Vivências Azuis</p>
          <p class="kicker"><span class="dot"></span> PECS · Desfralde</p>
          <h1>O vaso,<br /><em>em cartões.</em></h1>
          <p class="sub">A criança mostra, ouve e a casa anota a hora.</p>
          <p class="pill">toque · ouça · mostre</p>
        </div>
        <div class="polaroid">
          <img src="/pecs/banheiro.jpg" alt="" />
        </div>
        <img class="boy" src="/landing/hero-cards.jpg" alt="" />
      </div>
    </div>
  </body>
</html>
